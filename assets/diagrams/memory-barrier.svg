<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-labelledby="mem-barrier-title mem-barrier-desc">
  <title id="mem-barrier-title">Publishing an event with release and acquire barriers</title>
  <desc id="mem-barrier-desc">The producer writes the event into slot 7, then passes a release barrier, then publishes sequence 7. The sequence becomes visible to the consumer, which reads it, passes an acquire barrier, and only then reads the event from slot 7. Without the barriers, the steps could be reordered and the consumer could read the slot before the event is in it.</desc>

  <defs>
    <marker id="mem-barrier-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- ── Producer ────────────────────────────────── -->
  <text class="head" x="20" y="79">PRODUCER</text>

  <rect class="box" x="110" y="50" width="220" height="50" rx="4"/>
  <text class="mid" x="220" y="71">1. write the event</text>
  <text class="sub mid" x="220" y="88">into slot 7</text>

  <line class="barrier" x1="355" y1="40" x2="355" y2="110"/>
  <text class="sub warn mid" x="355" y="126">release barrier</text>

  <rect class="box" x="380" y="50" width="220" height="50" rx="4"/>
  <text class="mid" x="490" y="71">2. publish the sequence</text>
  <text class="sub mid" x="490" y="88">cursor = 7</text>

  <!-- sequence becomes visible to the consumer -->
  <line class="wire" x1="490" y1="102" x2="490" y2="148" marker-end="url(#mem-barrier-arrow)"/>
  <text class="sub" x="500" y="129">becomes visible</text>

  <!-- ── Consumer ────────────────────────────────── -->
  <text class="head" x="20" y="189">CONSUMER</text>

  <rect class="box" x="380" y="150" width="220" height="50" rx="4"/>
  <text class="mid" x="490" y="171">3. read the sequence</text>
  <text class="sub mid" x="490" y="188">sees 7: slot 7 is ready</text>

  <line class="barrier" x1="625" y1="140" x2="625" y2="210"/>
  <text class="sub warn mid" x="625" y="226">acquire barrier</text>

  <rect class="box" x="650" y="150" width="200" height="50" rx="4"/>
  <text class="mid" x="750" y="171">4. read the event</text>
  <text class="sub mid" x="750" y="188">from slot 7</text>

  <text class="sub mid" x="430" y="258">without the barriers, steps could be reordered, and the consumer might read slot 7 before the event is in it</text>
</svg>
