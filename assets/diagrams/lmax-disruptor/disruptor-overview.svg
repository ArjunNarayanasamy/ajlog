<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">How the Disruptor's components fit together</title>
  <desc id="overview-desc">A producer claims and publishes slots through the Sequencer, which owns the cursor sequence, and writes events into the Ring Buffer. On the consumer side, an Event Processor thread asks its Sequence Barrier which slots are ready, reads those events from the Ring Buffer, and calls the Event Handler's onEvent for each one. The barrier watches the Sequencer's cursor. The Sequencer in turn watches each Event Processor's sequence, so the producer can never lap the slowest consumer.</desc>

  <defs>
    <marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- ── Producer side ───────────────────────────── -->
  <rect class="box" x="20" y="120" width="150" height="50" rx="4"/>
  <text class="title mid" x="95" y="141">Producer</text>
  <text class="sub mid" x="95" y="158">your thread</text>

  <rect class="box" x="210" y="25" width="160" height="60" rx="4"/>
  <text class="title mid" x="290" y="49">Sequencer</text>
  <text class="sub mid" x="290" y="67">owns the cursor</text>

  <!-- producer claims and publishes through the sequencer -->
  <path class="link" d="M95,118 V55 H207" marker-end="url(#overview-arrow)"/>
  <text class="sub" x="103" y="48">claim, publish</text>

  <!-- producer writes events into the ring buffer -->
  <line class="link" x1="172" y1="145" x2="407" y2="145" marker-end="url(#overview-arrow)"/>
  <text class="sub mid" x="235" y="138">writes events</text>

  <!-- ── Ring buffer ─────────────────────────────── -->
  <rect class="box ok" x="410" y="105" width="200" height="80" rx="4"/>
  <text class="title mid" x="510" y="128">Ring Buffer</text>
  <rect class="slot" x="422" y="142" width="22" height="26"/>
  <rect class="slot" x="444" y="142" width="22" height="26"/>
  <rect class="slot" x="466" y="142" width="22" height="26"/>
  <rect class="slot" x="488" y="142" width="22" height="26"/>
  <rect class="slot" x="510" y="142" width="22" height="26"/>
  <rect class="slot" x="532" y="142" width="22" height="26"/>
  <rect class="slot" x="554" y="142" width="22" height="26"/>
  <rect class="slot" x="576" y="142" width="22" height="26"/>

  <!-- ── Consumer side ───────────────────────────── -->
  <rect class="box" x="650" y="25" width="190" height="60" rx="4"/>
  <text class="title mid" x="745" y="49">Sequence Barrier</text>
  <text class="sub mid" x="745" y="67">which slots are ready?</text>

  <rect class="box" x="650" y="120" width="190" height="50" rx="4"/>
  <text class="title mid" x="745" y="141">Event Processor</text>
  <text class="sub mid" x="745" y="158">consumer thread + sequence</text>

  <rect class="box" x="650" y="210" width="190" height="50" rx="4"/>
  <text class="title mid" x="745" y="231">Event Handler</text>
  <text class="sub mid" x="745" y="248">your code</text>

  <!-- barrier watches the cursor -->
  <line class="wire" x1="372" y1="55" x2="647" y2="55" marker-end="url(#overview-arrow)"/>
  <text class="sub mid" x="510" y="47">watches the cursor</text>

  <!-- processor asks the barrier, reads the ring, calls the handler -->
  <line class="link" x1="745" y1="118" x2="745" y2="88" marker-end="url(#overview-arrow)"/>
  <text class="sub" x="753" y="107">waitFor()</text>
  <line class="link" x1="648" y1="145" x2="613" y2="145" marker-end="url(#overview-arrow)"/>
  <text class="sub mid" x="630" y="138">reads</text>
  <line class="link" x1="745" y1="172" x2="745" y2="207" marker-end="url(#overview-arrow)"/>
  <text class="sub" x="753" y="194">onEvent()</text>

  <!-- gating: the sequencer watches the consumer's sequence -->
  <path class="wire" d="M648,162 H630 V228 H330 V88" marker-end="url(#overview-arrow)"/>
  <text class="sub mid" x="480" y="246">gating: the producer can't lap the slowest consumer</text>
</svg>
