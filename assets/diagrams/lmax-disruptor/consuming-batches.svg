<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 860 229" role="img" aria-labelledby="consume-title consume-desc">
  <title id="consume-title">Two consumers, each asking its barrier for a batch</title>
  <desc id="consume-desc">Sequences 30 to 37 on the 16-slot ring. The cursor is at 37. The business logic processor is at 31, the replicator at 33, the journaler at 34 and the unmarshaller at 35. The business logic processor asks its barrier for 32. Its barrier watches the cursor and the three consumers it depends on, and returns the lowest of them, 33, so its batch is 32 to 33. The unmarshaller asks for 36. Its barrier only watches the cursor, so it returns 37, and its batch is 36 to 37.</desc>

  <defs>
    <marker id="consume-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- ── Positions ───────────────────────────────── -->
  <text class="title mid" x="220" y="60">Business Logic Processor: 31</text>
  <line class="link" x1="220" y1="66" x2="220" y2="146" marker-end="url(#consume-arrow)"/>

  <text class="title mid" x="380" y="100">Replicator: 33</text>
  <line class="link" x1="380" y1="106" x2="380" y2="146" marker-end="url(#consume-arrow)"/>

  <text class="title mid" x="460" y="60">Journaler: 34</text>
  <line class="link" x1="460" y1="66" x2="460" y2="146" marker-end="url(#consume-arrow)"/>

  <text class="title mid" x="540" y="100">Unmarshaller: 35</text>
  <line class="link" x1="540" y1="106" x2="540" y2="146" marker-end="url(#consume-arrow)"/>

  <text class="value mid" x="700" y="60">cursor: 37</text>
  <line class="link" x1="700" y1="66" x2="700" y2="146" marker-end="url(#consume-arrow)"/>

  <!-- ── Sequences 30–37 ─────────────────────────── -->
  <rect class="box ok" x="100" y="150" width="80" height="46"/>
  <rect class="box ok" x="180" y="150" width="80" height="46"/>
  <rect class="box" x="260" y="150" width="80" height="46"/>
  <rect class="box" x="340" y="150" width="80" height="46"/>
  <rect class="box" x="420" y="150" width="80" height="46"/>
  <rect class="box" x="500" y="150" width="80" height="46"/>
  <rect class="box" x="580" y="150" width="80" height="46"/>
  <rect class="box" x="660" y="150" width="80" height="46"/>

  <text class="title mid" x="140" y="171">30</text><text class="sub mid" x="140" y="187">slot 14</text>
  <text class="title mid" x="220" y="171">31</text><text class="sub mid" x="220" y="187">slot 15</text>
  <text class="title mid" x="300" y="171">32</text><text class="sub mid" x="300" y="187">slot 0</text>
  <text class="title mid" x="380" y="171">33</text><text class="sub mid" x="380" y="187">slot 1</text>
  <text class="title mid" x="460" y="171">34</text><text class="sub mid" x="460" y="187">slot 2</text>
  <text class="title mid" x="540" y="171">35</text><text class="sub mid" x="540" y="187">slot 3</text>
  <text class="title mid" x="620" y="171">36</text><text class="sub mid" x="620" y="187">slot 4</text>
  <text class="title mid" x="700" y="171">37</text><text class="sub mid" x="700" y="187">slot 5</text>

  <!-- ── Batches ─────────────────────────────────── -->
  <path class="bracket" d="M262,204 v8 H418 v-8"/>
  <text class="title warn mid" x="340" y="232">Business Logic Processor's batch: 32–33</text>
  <text class="sub mid" x="340" y="250">waitFor(32) returns 33, held back by the replicator</text>

  <path class="bracket" d="M582,204 v8 H738 v-8"/>
  <text class="title warn mid" x="660" y="232">Unmarshaller's batch: 36–37</text>
  <text class="sub mid" x="660" y="250">waitFor(36) returns 37, limited only by the cursor</text>
</svg>
