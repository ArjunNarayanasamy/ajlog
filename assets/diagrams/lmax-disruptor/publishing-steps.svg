<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="publish-title publish-desc">
  <title id="publish-title">Publishing an event in three steps</title>
  <desc id="publish-desc">A section of the 16-slot ring, slots 3 to 8, holding sequences 35, 36 and 37 (published) and 22, 23 and 24 (free to reuse). Step 1, claim: next() returns 38, so slot 6, which still holds old event 22, is claimed for sequence 38. The cursor stays at 37. Step 2, write: the producer gets the event in slot 6 and overwrites its fields with event 38. The cursor still says 37, so consumers cannot see it. Step 3, publish: publish(38) moves the cursor to 38 with one release write, and consumers can now read slot 6.</desc>

  <defs>
    <marker id="publish-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- slot numbers, shared by all three rows -->
  <text class="sub mid" x="260" y="22">slot 3</text>
  <text class="sub mid" x="320" y="22">slot 4</text>
  <text class="sub mid" x="380" y="22">slot 5</text>
  <text class="sub mid" x="440" y="22">slot 6</text>
  <text class="sub mid" x="500" y="22">slot 7</text>
  <text class="sub mid" x="560" y="22">slot 8</text>

  <!-- ── 1. Claim ────────────────────────────────── -->
  <text class="title" x="20" y="46">1. Claim</text>
  <text class="sub" x="20" y="64">ringBuffer.next()</text>
  <text class="sub" x="20" y="80">returns 38</text>

  <rect class="box" x="230" y="30" width="60" height="40"/>
  <rect class="box" x="290" y="30" width="60" height="40"/>
  <rect class="box" x="350" y="30" width="60" height="40"/>
  <rect class="box claim" x="410" y="30" width="60" height="40"/>
  <rect class="box ok" x="470" y="30" width="60" height="40"/>
  <rect class="box ok" x="530" y="30" width="60" height="40"/>
  <text class="title mid" x="260" y="55">35</text>
  <text class="title mid" x="320" y="55">36</text>
  <text class="title mid" x="380" y="55">37</text>
  <text class="title mid" x="440" y="48">22</text>
  <text class="sub warn mid" x="440" y="63">for 38</text>
  <text class="title mid" x="500" y="55">23</text>
  <text class="title mid" x="560" y="55">24</text>

  <line class="link" x1="380" y1="102" x2="380" y2="74" marker-end="url(#publish-arrow)"/>
  <text class="value mid" x="380" y="116">cursor = 37</text>

  <text class="sub" x="620" y="46">a plain increment of the producer's</text>
  <text class="sub" x="620" y="62">own counter. Slot 6 still holds old</text>
  <text class="sub" x="620" y="78">event 22, and consumers can't see 38</text>

  <!-- ── 2. Write ────────────────────────────────── -->
  <text class="title" x="20" y="151">2. Write</text>
  <text class="sub" x="20" y="169">ringBuffer.get(38)</text>
  <text class="sub" x="20" y="185">then set the event's fields</text>

  <rect class="box" x="230" y="135" width="60" height="40"/>
  <rect class="box" x="290" y="135" width="60" height="40"/>
  <rect class="box" x="350" y="135" width="60" height="40"/>
  <rect class="box claim" x="410" y="135" width="60" height="40"/>
  <rect class="box ok" x="470" y="135" width="60" height="40"/>
  <rect class="box ok" x="530" y="135" width="60" height="40"/>
  <text class="title mid" x="260" y="160">35</text>
  <text class="title mid" x="320" y="160">36</text>
  <text class="title mid" x="380" y="160">37</text>
  <text class="title mid" x="440" y="153">38</text>
  <text class="sub warn mid" x="440" y="168">writing</text>
  <text class="title mid" x="500" y="160">23</text>
  <text class="title mid" x="560" y="160">24</text>

  <line class="link" x1="380" y1="207" x2="380" y2="179" marker-end="url(#publish-arrow)"/>
  <text class="value mid" x="380" y="221">cursor = 37</text>

  <text class="sub" x="620" y="151">ordinary field writes into the event</text>
  <text class="sub" x="620" y="167">object that's already in slot 6: no</text>
  <text class="sub" x="620" y="183">allocation. The cursor still says 37</text>

  <!-- ── 3. Publish ──────────────────────────────── -->
  <text class="title" x="20" y="256">3. Publish</text>
  <text class="sub" x="20" y="274">ringBuffer.publish(38)</text>
  <text class="sub" x="20" y="290">in a finally block</text>

  <rect class="box" x="230" y="240" width="60" height="40"/>
  <rect class="box" x="290" y="240" width="60" height="40"/>
  <rect class="box" x="350" y="240" width="60" height="40"/>
  <rect class="box" x="410" y="240" width="60" height="40"/>
  <rect class="box ok" x="470" y="240" width="60" height="40"/>
  <rect class="box ok" x="530" y="240" width="60" height="40"/>
  <text class="title mid" x="260" y="265">35</text>
  <text class="title mid" x="320" y="265">36</text>
  <text class="title mid" x="380" y="265">37</text>
  <text class="title mid" x="440" y="258">38</text>
  <text class="sub mid" x="440" y="273">published</text>
  <text class="title mid" x="500" y="265">23</text>
  <text class="title mid" x="560" y="265">24</text>

  <line class="link" x1="440" y1="312" x2="440" y2="284" marker-end="url(#publish-arrow)"/>
  <text class="value mid" x="440" y="326">cursor = 38</text>

  <text class="sub" x="620" y="256">one release write moves the cursor.</text>
  <text class="sub" x="620" y="272">Consumers waiting on their barrier</text>
  <text class="sub" x="620" y="288">can now read slot 6</text>
</svg>
